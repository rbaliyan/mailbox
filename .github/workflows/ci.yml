name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

# Cancel a superseded run for the same ref (e.g. when a PR's merge commit is
# recomputed after the base branch advances) so only the latest run reports.
# Only PR runs are cancelled; push-to-main runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Smoke tests
        run: go test -race -run '^(TestSmoke|Example)' -count=1 .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race ./...

      - name: Coverage gate
        run: ./scripts/coverage_gate.sh

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start backing services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Integration tests
        env:
          MONGO_URI: mongodb://localhost:27019/?directConnection=true
          POSTGRES_DSN: postgres://mailbox_test:mailbox_test@localhost:5433/mailbox_test?sslmode=disable
        run: go test -tags integration -race ./store/...

      - name: Stop backing services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Exercise every benchmark briefly so a broken or panicking benchmark is
      # caught in CI. Absolute timings are not gated (runner variance); use
      # `just bench-compare` locally for benchstat regression analysis.
      #
      # Dependabot PRs only touch dependency manifests and never the benchmarked
      # code, so skip the work for them. The step (not the job) is gated so the
      # job still reports success -- a skipped required check would block merge.
      - name: Run benchmarks
        if: github.actor != 'dependabot[bot]'
        run: go test -run='^$' -bench=. -benchmem -benchtime=10x ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4
          args: --tests=false

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v3
        with:
          languages: go
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v3
        with:
          category: "/language:go"
